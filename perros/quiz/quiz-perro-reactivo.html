<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test: ¿por qué tu perro ladra y se lanza en la calle?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>@font-face{font-family:"Cabinet Grotesk";src:url("https://anuncios-listos-beauty.netlify.app/fonts/CabinetGrotesk-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}</style>
<style>
:root{--paper:#F4EEE2;--paper-2:#EDE4D3;--card:#FFFDF8;--ink:#3A2A1F;--ink-2:#6E5A4B;--ink-3:#9C8878;--acc:#CF4A3A;--acc-dark:#B43C2E;--acc-soft:#F5D3CB;--cta:#CF4A3A;--ok:#5F8A3E;--ok-soft:#E3EBD6;--line:rgba(58,42,31,.14);--fd:"Cabinet Grotesk","Helvetica Neue",Arial,sans-serif;--ft:"Google Sans",system-ui,sans-serif;--fa:"Newsreader",Georgia,serif;--r:22px;--sh:0 1px 2px rgba(58,42,31,.06),0 18px 40px -22px rgba(58,42,31,.35)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ft);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--fd);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
em{font-family:var(--fa);font-style:italic;font-weight:500;color:var(--acc);letter-spacing:0}
img,video{max-width:100%;height:auto;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.app{width:100%;max-width:560px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:0 16px}
body.ancho .app{max-width:1040px}
/* Barra de arriba: volver, marca, avance */
.barra{position:sticky;top:0;z-index:20;background:var(--paper);padding:14px 0 12px}
.barra-fila{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3)}
.atras{border:0;background:none;width:44px;height:36px;margin-left:-10px;font-size:22px;line-height:1;color:var(--ink-2)}
.atras[hidden]{display:block;visibility:hidden}
.marca{flex:1;text-align:center;font-family:var(--fd);font-weight:800;color:var(--ink);font-size:15px}
.cuenta{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pantalla{flex:1;display:flex;flex-direction:column;animation:entra .3s ease-out}
/* Aire arriba: la portada y las páginas sin barra no arrancan pegadas al borde; las preguntas tienen espacio bajo la barra */
.pantalla.sola{padding-top:16px}
.pantalla>.h2:first-child{margin-top:18px}.pantalla>.pill:first-child{margin-top:16px}
@keyframes entra{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.pill{align-self:center;display:inline-flex;gap:6px;background:var(--acc-soft);color:var(--acc-dark);font-weight:600;font-size:13px;border-radius:99px;padding:6px 12px;margin:6px 0 12px}
.h1{font-size:clamp(27px,7.2vw,40px);text-align:center}
.h2{font-size:clamp(23px,6.2vw,32px);text-align:center;margin-top:6px}
.sub{color:var(--ink-2);text-align:center;margin:10px auto 0;font-size:16px;max-width:620px}
.nota{color:var(--ink-3);text-align:center;font-size:14px;margin:10px 0 0}
.pista{color:var(--ink-3);text-align:center;font-size:14px;margin:10px 0 0}
/* Antes y después en la portada (imagen o clip sin sonido) */
.pares{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.pares figure{margin:0;position:relative;border-radius:16px;overflow:hidden;background:var(--paper-2);aspect-ratio:1/.82}
.pares img,.pares video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pares figcaption{position:absolute;left:8px;right:8px;bottom:8px;width:fit-content;background:rgba(20,14,10,.78);color:#fff;font-size:12px;font-weight:600;border-radius:7px;padding:3px 8px;line-height:1.3}
.pares figure.bien figcaption{background:var(--ok)}
/* Opciones: tocar una opción solo la marca; para avanzar siempre se toca Continuar */
.ops{display:grid;gap:10px;margin-top:16px}
.ops.dos{grid-template-columns:1fr 1fr}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16.5px;font-weight:500;min-height:58px;transition:border-color .15s,background .15s;-webkit-tap-highlight-color:transparent}
.op:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.op .tx{flex:1}
.op .tx small{display:block;color:var(--ink-3);font-weight:400;font-size:14px;margin-top:1px}
.op .mk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;font-size:13px;color:#fff;transition:background .15s,border-color .15s}
.op.multi .mk{border-radius:7px}
.op.sel{border-color:var(--acc);background:var(--acc-soft)}
.op.sel .mk{background:var(--acc);border-color:var(--acc)}
.op.sel .mk::after{content:"✓"}
.ops.dos .op{flex-direction:column;justify-content:center;text-align:center;padding:14px 10px;gap:2px}
.ops.dos .op .tx{font-family:var(--fd);font-weight:800;font-size:20px}
.ops.dos .op .tx small{font-family:var(--ft);font-weight:400}
.ops.dos .op .mk{display:none}
@media (hover:hover){.op:hover{border-color:var(--acc)}}
.campo{width:100%;margin-top:22px;font:inherit;font-size:20px;padding:16px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.campo:focus{border-color:var(--acc)}
/* Botón Continuar: siempre a la vista, pegado abajo */
.accion{position:sticky;bottom:0;z-index:15;margin-top:auto;padding:18px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(244,238,226,0),var(--paper) 35%)}
/* En la pregunta de texto el botón va debajo del campo: con el teclado abierto, uno pegado abajo queda tapado */
.accion.junto{position:static;margin-top:20px;padding-top:0;background:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--cta);color:#fff;text-decoration:none;font-family:var(--fd);font-weight:800;font-size:19px;padding:17px 20px;border-radius:16px;box-shadow:0 10px 22px -12px var(--cta);transition:transform .1s,opacity .2s;text-align:center;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.38;box-shadow:none;cursor:default}
.late{animation:late 1.8s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.025)}}
.tarjeta{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-top:16px}
.tarjeta.osc{background:var(--ink);color:var(--paper);border:0}
.tarjeta.osc b{color:#fff}
.dato{font-size:15.5px;line-height:1.55}
.dato p{margin:0 0 10px}.dato p:last-child{margin:0}
.cita{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.perfil-top{display:flex;gap:14px;align-items:center}
.perfil-top img{width:72px;height:72px;border-radius:18px;object-fit:cover;background:var(--paper-2);flex:none}
.etq{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.medidor{margin-top:16px}
.riel{position:relative;height:12px;border-radius:9px;background:linear-gradient(90deg,var(--ok),#E9B949,var(--acc));margin-top:8px}
.pin{position:absolute;top:50%;left:4%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--card);border:4px solid var(--ink);transition:left 1.2s cubic-bezier(.2,.8,.2,1)}
.ejes{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px}
/* Carga */
.carga{align-items:center;text-align:center;padding-top:16px}
.anillo{width:150px;height:150px;position:relative;margin:12px auto 18px}
.anillo svg{transform:rotate(-90deg)}
.anillo b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:36px}
.pasos{list-style:none;padding:0;margin:4px 0 0;width:100%;display:grid;gap:10px;text-align:left}
.pasos li{display:flex;gap:10px;align-items:center;color:var(--ink-3);font-size:15.5px}
.pasos li i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}
.pasos li.ok{color:var(--ink)}
.pasos li.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.pasos li.ok i::after{content:"✓"}
.pasos li.va i{border-color:var(--acc);border-top-color:transparent;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.mini-testi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;font-size:14.5px;margin-top:16px;display:flex;gap:12px;align-items:center;width:100%}
.mini-testi img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.estrellas{color:#E3A008;letter-spacing:1px;font-size:13px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,14,10,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .tarjeta{max-width:480px;width:100%;margin:0;animation:entra .25s ease-out}
@media (min-width:700px){.modal{align-items:center}}
/* Video con controles propios (YouTube recortado arriba y abajo para no mostrar título ni barra) */
.vsl{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#111;box-shadow:var(--sh);margin-top:16px}
.vsl .yt{position:absolute;inset:0;overflow:hidden}
.vsl .yt iframe{position:absolute;left:0;top:-60px;width:100%;height:calc(100% + 120px);border:0;pointer-events:none}
.vsl-tapa{position:absolute;inset:0;cursor:pointer}
.vsl-pausa{position:absolute;inset:0;display:none;place-items:center;background:rgba(30,20,15,.55) center/cover no-repeat;cursor:pointer}
.vsl-pausa span{width:72px;height:72px;border-radius:50%;background:var(--cta);display:grid;place-items:center}
.vsl-pausa svg{width:30px;height:30px;fill:#fff;margin-left:4px}
.vsl.pausado .vsl-pausa{display:grid}
.vsl-sonido{position:absolute;inset:0;margin:auto;width:fit-content;height:fit-content;display:flex;align-items:center;gap:8px;border:0;background:var(--cta);color:#fff;font-family:var(--fd);font-weight:800;font-size:16px;padding:12px 16px;border-radius:14px;box-shadow:0 12px 26px -12px rgba(0,0,0,.6);animation:late 1.8s ease-in-out infinite;z-index:3}
.vsl-sonido svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vsl.con-sonido .vsl-sonido{display:none}
.vsl-barra{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .25s;z-index:2}
.vsl.con-sonido .vsl-barra{opacity:1}
@media (hover:hover){.vsl.con-sonido .vsl-barra{opacity:0}.vsl.con-sonido:hover .vsl-barra,.vsl.con-sonido.pausado .vsl-barra{opacity:1}}
.vsl-barra button{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.vsl-barra svg{width:18px;height:18px;fill:#fff}
.vsl-prog{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.3);cursor:pointer;position:relative}
.vsl-prog i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:var(--cta)}
/* Página final */
.oferta-top{position:sticky;top:0;z-index:25;margin:0 calc(50% - 50vw);background:var(--ink);color:var(--paper);font-size:14px;text-align:center;padding:9px 12px}
.oferta-top b{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.14);padding:2px 7px;border-radius:6px;color:#fff}
.sec{margin-top:44px}
.grid2{display:grid;gap:16px;margin-top:20px}
.grid2>.tarjeta{margin-top:0}
.resumen{display:grid;gap:8px;margin-top:14px}
.resumen div{display:flex;justify-content:space-between;gap:14px;font-size:14.5px;border-bottom:1px dashed var(--line);padding-bottom:7px}
.resumen div:last-child{border:0;padding:0}
.resumen span{color:var(--ink-3);flex:none}
.resumen b{text-align:right;font-weight:600}
.apto{display:flex;align-items:center;gap:14px}
.apto .num{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--fd);font-weight:800;font-size:20px;color:var(--ok);background:var(--ok-soft);line-height:1}
.apto .num small{display:block;font-size:11px;font-family:var(--ft);font-weight:600}
.apto.medio .num{color:#8A5D0B;background:#F6E7C4}
.cubre{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:11px}
.cubre li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.cubre li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.cubre li.parcial::before{content:"!";background:#F6E7C4;color:#8A5D0B}
.cubre small{display:block;color:var(--ink-2);font-size:13.5px;margin-top:2px}
.mas summary{cursor:pointer;color:var(--acc-dark);font-weight:600;font-size:14.5px;margin-top:12px;list-style:none}.mas summary::-webkit-details-marker{display:none}.mas summary::after{content:" ↓"}.mas[open] summary{display:none}
.aviso{margin-top:14px;background:#F6E7C4;border-radius:14px;padding:12px 14px;font-size:14.5px}
.que{display:grid;gap:14px;align-items:stretch;margin-top:20px}
.tapa-box{background:#fff;border-radius:var(--r);box-shadow:var(--sh);display:grid;place-items:center;padding:14px}
.tapa-box img{max-width:260px;width:100%}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dato-g{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.dato-g b{font-family:var(--fd);font-size:34px;line-height:1;color:var(--acc);letter-spacing:-.02em}
.dato-g span{font-weight:600;font-size:15px}
.dato-g small{color:var(--ink-3);font-size:13px;line-height:1.35}
.caps-tit{font-size:20px;text-align:center;margin-top:30px}
.pto{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);vertical-align:middle;flex:none}
.partes{display:grid;gap:12px;margin-top:14px}
.parte{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--sh)}
.parte-cab{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.parte-cab i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:14px}
.parte-cab h4{margin:0;font-family:var(--fd);font-size:17px}
.parte ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.parte li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-2)}
.parte li .nro{font-family:var(--fd);font-style:normal;font-weight:800;color:var(--ink-3);width:20px;text-align:right;flex:none}
.parte li span:not(.pto){flex:1}
.parte li.tuyo{color:var(--ink);font-weight:600}
.parte li.tuyo .nro{color:var(--acc)}
.que .tapa{max-width:240px;margin:0 auto}
.que ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.que li{display:flex;gap:10px;font-size:15.5px}
.que li::before{content:"✓";flex:none;color:var(--ok);font-weight:700}
.caps{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:7px;counter-reset:c}
.caps li{display:flex;gap:10px;align-items:baseline;font-size:15px;counter-increment:c;color:var(--ink-2);flex-wrap:wrap}
.caps li::before{content:counter(c);flex:none;width:22px;font-family:var(--fd);font-weight:800;color:var(--ink-3);text-align:right}
.caps li.tuyo{color:var(--ink);font-weight:600}
.caps li.tuyo::before{color:var(--acc)}
.caps li.tuyo span{background:linear-gradient(transparent 60%,var(--acc-soft) 60%)}
.paginas{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px -16px 0;padding:0 16px 10px;scrollbar-width:none}
.paginas::-webkit-scrollbar{display:none}
.paginas img{flex:none;width:150px;border-radius:10px;box-shadow:var(--sh);scroll-snap-align:start;background:var(--card)}
.etapas{display:grid;gap:10px;margin-top:14px}
.etapa{background:var(--paper);border-radius:16px;padding:14px}
.etapa .cab{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.etapa .cab b{font-family:var(--fd);font-size:13px;background:var(--ink);color:var(--paper);border-radius:8px;padding:4px 9px}
.etapa .cab h3{font-size:18px}
.etapa p{margin:8px 0 0;font-size:15px}
.etapa small{display:block;margin-top:6px;color:var(--ink-3);font-size:13px}
.testis{display:flex;gap:12px;margin:18px -16px 0;padding:0 16px 10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.testis::-webkit-scrollbar{display:none}.testis .testi{flex:none;width:78%;scroll-snap-align:center}
.desliza{text-align:center;font-size:13px;color:var(--ink-3);margin:4px 0 0}
.testi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.testi img{width:100%;aspect-ratio:4/3;object-fit:cover}
.testi>div{padding:12px 14px 14px;font-size:15px}
.testi .q{margin-bottom:6px;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.cifras div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12.5px;color:var(--ink-2);line-height:1.25}
.cifras b{display:block;font-family:var(--fd);font-size:24px;color:var(--acc);margin-bottom:3px}
.faq{max-width:760px;margin-left:auto;margin-right:auto}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--ink-3);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:8px 0 0;color:var(--ink-2);font-size:15px}
.precio-box{max-width:560px;margin:16px auto 0}
.incluye{display:grid;gap:12px;margin-top:6px}
.inc{display:flex;gap:12px;align-items:center}
.inc img{width:54px;height:68px;object-fit:cover;border-radius:8px;box-shadow:var(--sh);background:var(--paper-2);flex:none}
.inc div{flex:1;font-size:15px;line-height:1.35}
.inc small{display:block;color:var(--ink-3)}
.inc .val{flex:none;text-align:right;font-size:13px}
.inc .val s{color:var(--ink-3);display:block}
.inc .val b{color:var(--ok)}
.total{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;font-size:14.5px;color:var(--ink-2)}
.precio{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:4px 12px;margin-top:12px}
.precio s{color:var(--ink-3);font-size:18px;white-space:nowrap}
.precio b{font-family:var(--fd);font-size:42px;color:var(--acc);letter-spacing:-.02em;white-space:nowrap}
.por-dia{text-align:center;color:var(--ink-2);font-size:14px;margin-top:2px}
.estado{display:flex;justify-content:center;gap:6px 16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin-top:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px}
.confianza{display:flex;justify-content:center;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:12px}

/* Todo lo que se personaliza sale de acá. Cada valor tiene una regla explicable, nada al azar. */
calcular:function(r){
  var n=(r.nombre||'').trim().replace(/\s+/g,' ');n=n?n.charAt(0).toUpperCase()+n.slice(1):'';
  var nombre=n||'tu perro',Nombre=n||'Tu perro';
  var dis=r.disparadores||[],hace=r.hace||[],dueno=(r.dueno||[]).filter(function(x){return x!=='Ninguna'}),probo=(r.probo||[]).filter(function(x){return x!=='Nada todavía'});
  var tiene=function(a,re){return a.some(function(x){return re.test(x)})};
  var mordio=tiene(hace,/mordió/),gru=tiene(hace,/Gruñe/);
  /* Tipo: miedo si se queda duro, gruñe, retrocede o ya mordió; frustración si quiere ir a saludar */
  var miedo=tiene(hace,/duro|Gruñe|Retrocede|mordió/),frus=tiene(hace,/saludar/);
  var tipo=miedo&&frus?'mixta':miedo?'miedo':frus?'frustracion':'correa';
  var TIPOS={
    miedo:['Reactividad por miedo','Ladra o se lanza para alejar lo que le asusta. Lo que más le sirve es sentirse seguro a distancia.'],
    frustracion:['Reactividad por frustración','Quiere acercarse y, como la correa no lo deja, explota. Lo que más le sirve es aprender a mirarte en vez de tirar.'],
    mixta:['Reactividad mixta','Muestra señales de miedo y también de querer acercarse. El capítulo 1 te ayuda a ver cuál pesa más.'],
    correa:['Reactividad de correa','Reacciona sobre todo cuando va con correa. Detrás suele haber miedo o frustración: el capítulo 1 te ayuda a ver cuál es.']
  };
  /* Distancia de inicio: más lejos que donde hoy reacciona */
  var D={'Apenas lo ve, aunque esté lejos':['a más de una cuadra','unos 40 metros o más',78],'A media cuadra':['a media cuadra','unos 30 metros',62],'Recién cuando lo tiene cerca':['cuando lo tiene cerca','unos 15 metros',48],'No me di cuenta':['todavía no lo sabes','la distancia que encuentres en la semana 1',58]}[r.distancia]||['','unos 30 metros',60];
  /* Nivel: distancia + cuántas cosas lo alteran + qué hace (explicado en la pantalla) */
  var nivel=D[2]+Math.max(0,dis.length-1)*5+(gru?8:0)+(mordio?14:0)+(tiene(hace,/Tira/)?3:0);
  nivel=Math.max(25,Math.min(92,nivel));
  var etiqueta=nivel>=75?'alto':nivel>=50?'moderado':'leve';
  /* Qué trata la guía de lo que contó */
  var items=[],caps={};
  function sumar(it){items.push({que:it[0],donde:it[1],ok:it[2]===1});it[3].forEach(function(c){caps[c]=1})}
  dis.forEach(function(x){if(CUBRE.disparadores[x])sumar(CUBRE.disparadores[x])});
  hace.forEach(function(x){if(CUBRE.hace[x])sumar(CUBRE.hace[x])});
  if(r.distancia)sumar([r.distancia==='No me di cuenta'?'No sabes a qué distancia reacciona':'Reacciona '+D[0],'El umbral y cómo encontrar su distancia tranquila (cap. 3)',1,[3]]);
  dueno.forEach(function(x){if(CUBRE.dueno[x])sumar(CUBRE.dueno[x])});
  var DUROS={'Retarlo o decirle "¡no!" fuerte':'retarlo','Darle un tirón de correa':'darle tirones de correa','Collar de ahorque o de púas':'el collar de ahorque o de púas'};
  var duros=probo.filter(function(x){return DUROS[x]}).map(function(x){return DUROS[x]});
  var y=function(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1]};
  if(duros.length)sumar(['Probaste '+y(duros),'Por qué eso lo empeora y qué hacer en su lugar (cap. 4)',1,[4]]);
  if(probo.indexOf('Distraerlo con premios')>-1)sumar(['Los premios no alcanzaron','Por qué el premio tiene que llegar antes de que explote (cap. 7, errores comunes)',1,[7]]);
  caps[10]=1;
  var cubiertas=items.filter(function(x){return x.ok}).length,total=items.length;
  var apto=mordio?['Útil, junto con un profesional','medio']:cubiertas===total?['Muy adecuada para '+nombre,'']:['Adecuada para casi todo lo que contaste','medio'];
  var listaDis=dis.length?dis.map(function(x){return x.toLowerCase()}):['otros perros'];
  /* Para practicar en la calle solo sirven perros, personas y bicis; la ventana y los ruidos van aparte */
  var calle=dis.filter(function(x){return /Otros perros|Personas|Bicis/.test(x)}).map(function(x){return x.toLowerCase()});
  var min=/5/.test(r.tiempo||'')?'5':/20/.test(r.tiempo||'')?'20':'10';
  return {nombre:nombre,Nombre:Nombre,tipo:tipo,tipoT:TIPOS[tipo][0],tipoD:TIPOS[tipo][1],distA:D[0],distInicio:D[1],sinDist:r.distancia==='No me di cuenta',
    nivel:nivel,etiqueta:etiqueta,items:items,cubiertas:cubiertas,total:total,apto:apto,caps:caps,mordio:mordio,
    listaDis:listaDis,listaTxt:y(listaDis),primero:calle[0]||'lo que lo altera',otros:calle.slice(1),ventana:tiene(dis,/ventana/),ruidos:tiene(dis,/Ruidos/),min:min,duros:duros,durosTxt:y(duros)};
},

alMostrarOferta:function(v){
  /* Cuenta regresiva por visitante: 14:38 (878 s), se guarda y arranca de nuevo al vencer */
  var k='urg-quiz-perro-fin',fin=0;try{fin=+localStorage.getItem(k)||0}catch(e){}
  function nuevo(){fin=Date.now()+878e3;try{localStorage.setItem(k,fin)}catch(e){}}
  if(!fin||fin<Date.now())nuevo();
  function tic(){var s=Math.round((fin-Date.now())/1e3);if(s<=0){nuevo();s=878}var t=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');document.querySelectorAll('[data-timer]').forEach(function(e){e.textContent=t})}
  tic();setInterval(tic,1000);
  /* Valores de los regalos según la moneda que pone la tienda (igual que la landing) */
  var px=document.querySelector('[data-precio]'),tx=px?px.textContent:'',ars=/AR|\$\s?\d{1,3}\.\d{3}/.test(tx);
  var VAL=ars?{b1:9990,b2:6990}:{b1:7,b2:5};
  function num(t){t=(t||'').replace(/[^\d.,]/g,'');return ars?parseFloat(t.replace(/\./g,'').replace(',','.'))||0:parseFloat(t.replace(',','.'))||0}
  function fmt(x){return ars?'AR$ '+Math.round(x).toLocaleString('es-AR'):'US$ '+(x%1?x.toFixed(2):String(x)).replace('.',',')}
  var p=num(tx),o=num((document.querySelector('[data-valor="guia"]')||{}).textContent)||p;
  document.querySelectorAll('[data-valor="guia"]').forEach(function(e){e.textContent=fmt(o)});
  document.querySelectorAll('[data-valor="b1"]').forEach(function(e){e.textContent=fmt(VAL.b1)});
  document.querySelectorAll('[data-valor="b2"]').forEach(function(e){e.textContent=fmt(VAL.b2)});
  document.querySelectorAll('[data-valor="total"]').forEach(function(e){e.textContent=fmt(o+VAL.b1+VAL.b2)});
  document.querySelectorAll('[data-por-dia]').forEach(function(e){e.textContent=p?'Pago único: menos de '+fmt(Math.ceil(p/30*(ars?1:100))/(ars?1:100))+' por día durante el primer mes de práctica.':''});
  /* Barra fija del celular: invita a bajar al precio; no aparece arriba de todo ni cuando el precio ya está a la vista */
  var fija=document.getElementById('fija'),precio=document.getElementById('precio');
  function revisar(){if(!fija||!precio)return;var r=precio.getBoundingClientRect();fija.classList.toggle('ver',window.scrollY>500&&r.top>window.innerHeight*.6)}
  window.addEventListener('scroll',revisar,{passive:true});revisar();
  var ir=document.querySelector('[data-ir-precio]');if(ir)ir.onclick=function(e){e.preventDefault();precio.scrollIntoView({behavior:'smooth',block:'start'})};
  document.querySelectorAll('[data-compra]').forEach(function(a){a.addEventListener('click',function(){try{if(window.fbq)fbq('trackCustom','QuizClicCompra',{})}catch(e){}})});
}
};

function pista(p){return p.tipo==='varias'?'<p class="pista">Puedes elegir varias</p>':p.opciones?'<p class="pista">Elige una</p>':''}
function par(x){var m=x.video?'<video src="'+img(x.video)+'" poster="'+img(x.poster)+'" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>':'<img src="'+img(x.img)+'" alt="">';return '<figure class="'+(x.bien?'bien':'')+'">'+m+'<figcaption>'+T(x.texto)+'</figcaption></figure>'}
var R={
  portada:function(p){return '<div class="pantalla sola">'+(p.pares?'<div class="pares">'+p.pares.map(par).join('')+'</div>':'')+(p.pill?'<span class="pill">'+T(p.pill)+'</span>':'')+'<h1 class="h1">'+T(p.titulo)+'</h1>'+(p.sub?'<p class="sub">'+T(p.sub)+'</p>':'')+'<h2 class="h2" style="font-size:21px;margin-top:22px">'+T(p.pregunta)+'</h2>'+ops(p)+(p.pie?'<p class="nota">'+T(p.pie)+'</p>':'')+accion(p)+'</div>'},
  pregunta:function(p){
    var cuerpo=p.tipo==='texto'?'<input class="campo" id="campo" maxlength="20" autocomplete="off" autocapitalize="words" enterkeyhint="next" placeholder="'+esc(p.placeholder||'')+'" value="'+esc(st.r[p.id]||'')+'" aria-label="'+esc(p.titulo)+'">':pista(p)+ops(p);
    return '<div class="pantalla"><h2 class="h2">'+T(p.titulo)+'</h2>'+(p.sub?'<p class="sub">'+T(p.sub)+'</p>':'')+cuerpo+accion(p)+'</div>'},
  info:function(p){return '<div class="pantalla">'+(p.pill?'<span class="pill">'+T(p.pill)+'</span>':'')+'<h2 class="h2">'+T(p.titulo)+'</h2><div class="tarjeta'+(p.oscuro?' osc':'')+' dato">'+T(p.html)+'</div>'+(p.cita?'<p class="cita">'+T(p.cita)+'</p>':'')+(p.opciones?'<h3 style="text-align:center;font-size:18px;margin-top:20px">'+T(p.pregunta)+'</h3>'+ops(p):'')+accion(p)+'</div>'},
  perfil:function(p){return '<div class="pantalla"><span class="pill">'+T(p.pill)+'</span><h2 class="h2">'+T(p.titulo)+'</h2>'+T(p.html)+accion(p)+'</div>'},
  carga:function(p){return '<div class="pantalla carga sola"><h2 class="h2">'+T(p.titulo)+'</h2><div class="anillo"><svg viewBox="0 0 120 120" width="150" height="150"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="arco" cx="60" cy="60" r="52" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327"/></svg><b id="pct">0%</b></div><ul class="pasos">'+p.pasos.map(function(x){return '<li><i></i><span>'+T(x)+'</span></li>'}).join('')+'</ul><div id="testi-carga" style="width:100%"></div></div>'},
  oferta:function(){return C.oferta(V(),{T:T,img:img,esc:esc,vsl:vslHTML})}
};
function pintar(){
  var p=S[st.i];
  document.body.classList.toggle('ancho',p.tipo==='oferta');
  var vieja=document.querySelector('.modal');if(vieja)vieja.remove();
  if(p.tipo==='oferta'&&!st.vio){st.vio=1;guardar();ev('QuizCompleto',{});try{if(window.fbq)fbq('track','ViewContent',{content_name:C.marca})}catch(e){}}
  var tipo=/^(una|varias|texto)$/.test(p.tipo)?'pregunta':p.tipo;
  app.innerHTML=barra(p)+R[tipo](p);
  var a=app.querySelector('[data-atras]');if(a)a.onclick=atras;
  var b=app.querySelector('[data-sig]');
  function act(){if(b)b.disabled=!valido(p)}
  marcar(app,p,act);
  var cp=app.querySelector('#campo');
  if(cp){cp.oninput=function(){st.r[p.id]=cp.value.replace(/[<>{}]/g,'');guardar();act()};cp.onkeydown=function(e){if(e.key==='Enter'&&valido(p)){cp.blur();sig()}};if(window.matchMedia('(hover:hover)').matches)setTimeout(function(){cp.focus()},300)}
  if(b)b.onclick=function(){if(valido(p))sig()};
  if(p.tipo==='perfil'){var pin=app.querySelector('.pin');if(pin)setTimeout(function(){pin.style.left=pin.getAttribute('data-v')+'%'},200)}
  if(p.tipo==='carga')cargar(p);
  if(p.tipo==='oferta'){if(C.alMostrarOferta)C.alMostrarOferta(V());vslInit()}
}
/* Marca opciones: una sola (radio) o varias (con opciones que excluyen al resto, como "Ninguna") */
function marcar(cont,p,act){
  cont.querySelectorAll('[data-op]').forEach(function(el){el.onclick=function(){
    var o=opcion(p.opciones[+el.dataset.op]);
    if(p.tipo==='varias'){
      var arr=(st.r[p.id]||[]).slice(),k=arr.indexOf(o.t);
      if(o.unica)arr=k>-1?[]:[o.t];
      else{arr=arr.filter(function(x){return !p.opciones.some(function(q){q=opcion(q);return q.unica&&q.t===x})});k=arr.indexOf(o.t);if(k>-1)arr.splice(k,1);else arr.push(o.t)}
      st.r[p.id]=arr;
    }else st.r[p.id]=o.t;
    cont.querySelectorAll('[data-op]').forEach(function(e2){var t=opcion(p.opciones[+e2.dataset.op]).t,on=p.tipo==='varias'?st.r[p.id].indexOf(t)>-1:st.r[p.id]===t;e2.classList.toggle('sel',on);e2.setAttribute('aria-checked',on)});
    guardar();act();
  }});
}
/* Carga: avanza sola; a la mitad frena para una pregunta (se elige y se toca Continuar) */
function cargar(p){
  var lis=app.querySelectorAll('.pasos li'),dur=p.ms||7000,t0=Date.now(),arco=app.querySelector('#arco'),pc=app.querySelector('#pct'),hecho=false;
  var tt=app.querySelector('#testi-carga'),ts=p.testimonios||[],ti=0;
  function testi(){if(!ts.length)return;var x=ts[ti++%ts.length];tt.innerHTML='<div class="mini-testi" style="animation:entra .4s">'+(x.foto?'<img src="'+img(x.foto)+'" alt="">':'')+'<div><b style="font-size:14px">'+esc(x.n)+'</b> <span class="estrellas">★★★★★</span><br>'+esc(x.t)+'</div></div>'}
  testi();var it=setInterval(testi,2800);
  function dibujar(f){var e=f<.6?f/.6*.7:.7+(f-.6)/.4*.3;arco.setAttribute('stroke-dashoffset',327-327*e);pc.textContent=Math.round(e*100)+'%';
    lis.forEach(function(li,k){var a=k/lis.length,c=(k+1)/lis.length;li.className=e>=c?'ok':e>=a?'va':''})}
  var q=p.pregunta,pausa=q&&!st.r[q.id],enPausa=false,pausado=0;
  var reloj=setInterval(function(){
    if(!document.body.contains(arco)){clearInterval(reloj);clearInterval(it);return}
    if(enPausa)return;
    var f=Math.min(1,(Date.now()-t0-pausado)/dur);
    if(pausa&&f>=.55){pausa=false;enPausa=true;pausado=Date.now()-t0-.55*dur;dibujar(.55);var tp=Date.now();
      var md=document.createElement('div');md.className='modal';
      md.innerHTML='<div class="tarjeta" role="dialog" aria-modal="true"><h3 style="font-size:21px;text-align:center">'+T(q.titulo)+'</h3>'+pista(q)+ops(q)+'<div style="margin-top:16px"><button type="button" class="btn" data-mq disabled>Continuar</button></div></div>';
      document.body.appendChild(md);
      var bq=md.querySelector('[data-mq]');
      marcar(md,q,function(){bq.disabled=!valido(q)});
      bq.onclick=function(){if(!valido(q))return;md.remove();pausado+=Date.now()-tp;enPausa=false};
      return}
    dibujar(f);
    if(f>=1&&!hecho){hecho=true;clearInterval(reloj);clearInterval(it);setTimeout(sig,500)}
  },50);
}
/* VSL de YouTube con controles propios: arranca solo y sin sonido; "Toca para escuchar" lo reinicia desde el principio con sonido */
function vslHTML(){if(!C.vsl)return '';return '<div class="vsl" id="vsl"><div class="yt"><div id="yt-player"></div></div><div class="vsl-tapa" id="vsl-tapa"></div><div class="vsl-pausa" style="background-image:linear-gradient(rgba(30,20,15,.45),rgba(30,20,15,.45)),url(\''+img(C.vsl.poster)+'\')"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></span></div><button class="vsl-sonido" id="vsl-sonido" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Toca para escuchar</button><div class="vsl-barra"><button type="button" id="vsl-play" aria-label="Pausar o reproducir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button><div class="vsl-prog" id="vsl-prog" aria-label="Avance del video"><i></i></div><button type="button" id="vsl-mute" aria-label="Silenciar o activar sonido"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 8.5a5 5 0 0 1 0 7" fill="none" stroke="#fff" stroke-width="2"/></svg></button></div></div>'}
function vslInit(){
  var c=document.getElementById('vsl');if(!c)return;
  var bS=c.querySelector('#vsl-sonido'),bP=c.querySelector('#vsl-play'),bM=c.querySelector('#vsl-mute'),tapa=c.querySelector('#vsl-tapa'),pausa=c.querySelector('.vsl-pausa'),prog=c.querySelector('#vsl-prog'),barraV=prog.querySelector('i');
  var P='<path d="M7 4v16l13-8z"/>',PA='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',ON='<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 8.5a5 5 0 0 1 0 7" fill="none" stroke="#fff" stroke-width="2"/>',OFF='<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6" fill="none" stroke="#fff" stroke-width="2"/>';
  var yt=null,listo=false;
  function crear(){yt=new YT.Player('yt-player',{videoId:C.vsl.id,playerVars:{autoplay:1,mute:1,controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,disablekb:1,fs:0},
    events:{onReady:function(){listo=true;yt.mute();yt.playVideo()},onStateChange:function(e){c.classList.toggle('pausado',e.data===2||e.data===0);bP.querySelector('svg').innerHTML=e.data===1?PA:P;if(e.data===0){yt.seekTo(0,true);yt.pauseVideo()}}}})}
  if(window.YT&&YT.Player)crear();else{window.onYouTubeIframeAPIReady=crear;var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)}
  function alternar(){if(!listo)return;yt.getPlayerState()===1?yt.pauseVideo():yt.playVideo()}
  bS.onclick=function(){if(!listo)return;yt.unMute();yt.setVolume(100);yt.seekTo(0,true);yt.playVideo();setTimeout(function(){if(yt.getPlayerState()!==1)yt.playVideo()},400);c.classList.add('con-sonido');bM.querySelector('svg').innerHTML=ON;ev('QuizVideoSonido',{})};
  tapa.onclick=function(){c.classList.contains('con-sonido')?alternar():bS.click()};
  pausa.onclick=function(){c.classList.contains('con-sonido')?alternar():bS.click()};
  bP.onclick=alternar;
  bM.onclick=function(){if(!listo)return;if(yt.isMuted()){yt.unMute();bM.querySelector('svg').innerHTML=ON}else{yt.mute();bM.querySelector('svg').innerHTML=OFF}};
  prog.onclick=function(e){if(!listo)return;var r=prog.getBoundingClientRect();yt.seekTo(yt.getDuration()*(e.clientX-r.left)/r.width,true)};
  setInterval(function(){if(listo&&yt.getDuration&&yt.getDuration())barraV.style.width=(100*yt.getCurrentTime()/yt.getDuration())+'%'},250);
}
pintar();
})();
</script>
